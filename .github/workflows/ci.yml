name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python3 -m py_compile stock_screener.py

      - name: --help smoke test
        run: python3 stock_screener.py --help

      - name: --list-indices smoke test
        run: python3 stock_screener.py --list-indices

      - name: build_ticker_lists.py --list smoke test
        run: python3 build_ticker_lists.py --list

      - name: Unit tests (offline)
        run: python3 -m pytest -q
